<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Resource Allocations - ResQLink</title>
</head>
<body>
<div th:fragment="content">
    <div class="container-fluid px-4 py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-arrow-left-right text-success me-2"></i>Resource Allocations</h3>
                <p class="text-muted small mb-0">Record of assigned supplies from relief depots to emergency aid requests</p>
            </div>
            <a th:href="@{/requests/triage}" class="btn btn-danger fw-bold shadow-sm">
                <i class="bi bi-lightning-charge me-1"></i> Triage & Allocate
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Allocation Code</th>
                            <th>Request ID</th>
                            <th>Supplies Assigned</th>
                            <th>Depot / Organization</th>
                            <th>Allocated At</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${allocations}">
                            <td><strong th:text="${a.allocationCode}">ALC-001</strong></td>
                            <td>
                                <strong th:text="${a.emergencyRequest.trackingCode}">REQ-001</strong>
                                <div class="small text-muted" th:text="${a.emergencyRequest.requesterName}">Requester</div>
                            </td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${a.resourceItem.name}">Item</div>
                                <span class="badge bg-success" th:text="${a.allocatedQuantity} + ' ' + ${a.resourceItem.unit}">Qty</span>
                            </td>
                            <td>
                                <div th:text="${a.resourceItem.depotLocationName}">Depot</div>
                                <div class="small text-muted" th:text="${a.resourceItem.organization.name}">Org</div>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(a.allocatedAt, 'dd MMM, HH:mm')}">Time</td>
                            <td>
                                <span class="badge" th:classappend="'bg-' + ${a.status.badgeClass}" th:text="${a.status.label}">CONFIRMED</span>
                            </td>
                            <td>
                                <a th:if="${a.status.name() == 'CONFIRMED' || a.status.name() == 'PROPOSED'}"
                                   th:href="@{/transport/dispatch/{id}(id=${a.id})}" class="btn btn-sm btn-primary fw-bold">
                                    <i class="bi bi-truck me-1"></i> Dispatch Fleet
                                </a>
                                <span th:if="${a.status.name() == 'DISPATCHED' || a.status.name() == 'COMPLETED'}" class="badge bg-light text-dark border">Dispatched</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
