<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Register Resource Supplies - ResQLink</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-primary text-white p-4">
                        <h4 class="fw-bold mb-1"><i class="bi bi-boxes me-2"></i>Register Relief Stock</h4>
                        <p class="text-white-50 small mb-0">Record available inventory at regional disaster supply depots</p>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/resources/register}" method="post">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Relief Organization / Supplier <span class="text-danger">*</span></label>
                                    <select class="form-select" name="organizationId" required>
                                        <option th:each="org : ${organizations}" th:value="${org.id}" th:text="${org.name}">Organization</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Item Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="name" placeholder="e.g. Inflatable Rescue Boats, Drinking Water" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Resource Category <span class="text-danger">*</span></label>
                                    <select class="form-select" name="category" required>
                                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}">Category</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Total Stock Quantity <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" name="totalQuantity" value="100" min="1" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Unit of Measure <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="unit" value="kits" placeholder="kits, boxes, cans, liters, boats" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Depot Warehouse / Base Location <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="depotLocationName" placeholder="e.g. NDRF Central Logistics Base, Chennai" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Depot Latitude <span class="text-danger">*</span></label>
                                    <input type="number" step="any" class="form-control" name="depotLatitude" value="13.0827" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Depot Longitude <span class="text-danger">*</span></label>
                                    <input type="number" step="any" class="form-control" name="depotLongitude" value="80.2707" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Description / Specs</label>
                                    <textarea class="form-control" name="description" rows="2" placeholder="Specifications, packaging details, storage instructions..."></textarea>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold mt-4 shadow-sm">
                                Register Supplies in ResQLink Inventory
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
