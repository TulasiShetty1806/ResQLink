<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Sign In - ResQLink Crisis Command</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white p-4 text-center">
                        <i class="bi bi-shield-lock-fill text-danger fs-1 mb-2 d-block"></i>
                        <h4 class="fw-bold mb-1">ResQLink Portal Access</h4>
                        <p class="text-secondary small mb-0">Disaster Emergency Command & Resource Network</p>
                    </div>

                    <div class="card-body p-4">
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> Invalid username or password.
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">
                            <i class="bi bi-info-circle me-2"></i> You have logged out successfully.
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle me-2"></i> Account registered! Please sign in.
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/login}" method="post" id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to ResQLink
                            </button>
                        </form>

                        <!-- Demo 1-Click Fast Login Bar -->
                        <div class="mt-4 pt-3 border-top">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">⚡ 1-Click Fast Demo Login</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <button type="button" class="btn btn-sm btn-outline-danger w-100 text-start" onclick="quickLogin('admin', 'password')">
                                        <i class="bi bi-shield-shaded me-1"></i> <strong>Coordinator</strong>
                                        <div class="small text-muted" style="font-size: 10px">admin / password</div>
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button type="button" class="btn btn-sm btn-outline-primary w-100 text-start" onclick="quickLogin('redcross', 'password')">
                                        <i class="bi bi-building me-1"></i> <strong>Organization</strong>
                                        <div class="small text-muted" style="font-size: 10px">redcross / password</div>
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button type="button" class="btn btn-sm btn-outline-success w-100 text-start" onclick="quickLogin('driver1', 'password')">
                                        <i class="bi bi-truck me-1"></i> <strong>Logistics</strong>
                                        <div class="small text-muted" style="font-size: 10px">driver1 / password</div>
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button type="button" class="btn btn-sm btn-outline-secondary w-100 text-start" onclick="quickLogin('citizen1', 'password')">
                                        <i class="bi bi-person me-1"></i> <strong>Citizen</strong>
                                        <div class="small text-muted" style="font-size: 10px">citizen1 / password</div>
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="card-footer bg-light text-center py-3">
                        <span class="small text-muted">New organization or volunteer? <a th:href="@{/register}" class="text-decoration-none fw-bold">Register Account</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
