<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Disaster Incidents - ResQLink</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-exclamation-octagon text-danger me-2"></i>Emergency Disaster Incidents</h3>
                <p class="text-muted small mb-0">Disaster zones requiring multi-agency resource coordination</p>
            </div>
            <div sec:authorize="hasRole('COORDINATOR')">
                <a th:href="@{/incidents/create}" class="btn btn-danger fw-bold shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Declare New Incident
                </a>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="inc : ${incidents}">
                <div class="card h-100 shadow-sm border-0 rounded-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge" th:classappend="'bg-' + ${inc.severity.badgeClass}" th:text="${inc.severity.label}">CRITICAL</span>
                            <span class="badge" th:classappend="'bg-' + ${inc.status.badgeClass}" th:text="${inc.status.label}">ACTIVE</span>
                        </div>
                        <h5 class="fw-bold mb-2">
                            <a th:href="@{/incidents/{id}(id=${inc.id})}" class="text-decoration-none text-dark" th:text="${inc.title}">Incident Title</a>
                        </h5>
                        <p class="text-muted small mb-2"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="${inc.locationName}">Location</span></p>
                        <p class="small text-secondary mb-3" th:text="${#strings.abbreviate(inc.description, 140)}">Description...</p>

                        <div class="d-flex justify-content-between small text-muted pt-2 border-top">
                            <span><i class="bi bi-people me-1"></i> ~<strong th:text="${inc.affectedPeopleEstimate}">0</strong> Affected</span>
                            <span><i class="bi bi-heartbreak me-1"></i> <strong th:text="${inc.casualtiesReported}">0</strong> Casualties</span>
                        </div>
                    </div>
                    <div class="card-footer bg-light border-0 d-flex justify-content-between align-items-center py-2 px-3">
                        <small class="text-muted" th:text="${inc.incidentCode}">INC-001</small>
                        <a th:href="@{/incidents/{id}(id=${inc.id})}" class="btn btn-sm btn-outline-danger">View Details & Requests</a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
