<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Declare Emergency Incident - ResQLink</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-dark text-white p-4">
                        <h4 class="fw-bold mb-1"><i class="bi bi-shield-plus text-danger me-2"></i>Declare Emergency Incident</h4>
                        <p class="text-secondary small mb-0">Creates an active crisis zone for multi-agency disaster response</p>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/incidents/create}" method="post">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Incident Title <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="title" placeholder="e.g. Coastal Flash Floods - Velachery Sector" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Disaster Type <span class="text-danger">*</span></label>
                                    <select class="form-select" name="incidentType" required>
                                        <option th:each="t : ${incidentTypes}" th:value="${t}" th:text="${t.label}">Type</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Severity Rating <span class="text-danger">*</span></label>
                                    <select class="form-select" name="severity" required>
                                        <option th:each="s : ${severities}" th:value="${s}" th:text="${s.label}">Severity</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Location / Area Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="locationName" placeholder="e.g. Velachery Lowlands, Chennai" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Epicenter Latitude <span class="text-danger">*</span></label>
                                    <input type="number" step="any" class="form-control" name="latitude" value="12.9815" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Epicenter Longitude <span class="text-danger">*</span></label>
                                    <input type="number" step="any" class="form-control" name="longitude" value="80.2180" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Impact Radius (km)</label>
                                    <input type="number" step="0.5" class="form-control" name="radiusKm" value="10.0">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Estimated Affected Population</label>
                                    <input type="number" class="form-control" name="affectedPeopleEstimate" value="1000">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Casualties Reported</label>
                                    <input type="number" class="form-control" name="casualtiesReported" value="0">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Description / Ground Situation</label>
                                    <textarea class="form-control" name="description" rows="3" placeholder="Provide situation update, key hazards, infrastructural collapses..."></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/incidents}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-danger fw-bold px-4">Declare Emergency</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
