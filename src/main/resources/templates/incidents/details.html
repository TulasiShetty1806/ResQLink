<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Incident Details - ResQLink</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">

        <div class="card shadow-sm border-0 rounded-4 mb-4">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-start mb-3">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="badge" th:classappend="'bg-' + ${incident.severity.badgeClass}" th:text="${incident.severity.label}">CRITICAL</span>
                            <span class="badge" th:classappend="'bg-' + ${incident.status.badgeClass}" th:text="${incident.status.label}">ACTIVE</span>
                            <span class="badge bg-light text-dark border" th:text="${incident.incidentCode}">INC-001</span>
                        </div>
                        <h2 class="fw-bold mb-1" th:text="${incident.title}">Incident Title</h2>
                        <p class="text-muted mb-0"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="${incident.locationName}">Location</span> (Lat: <span th:text="${incident.latitude}">0</span>, Lon: <span th:text="${incident.longitude}">0</span>)</p>
                    </div>

                    <!-- Coordinator Status Toggle Form -->
                    <div sec:authorize="hasRole('COORDINATOR')" class="mt-3 mt-md-0">
                        <form th:action="@{/incidents/{id}/status(id=${incident.id})}" method="post" class="d-flex gap-2">
                            <select name="status" class="form-select form-select-sm">
                                <option value="ACTIVE" th:selected="${incident.status.name() == 'ACTIVE'}">ACTIVE</option>
                                <option value="CONTAINED" th:selected="${incident.status.name() == 'CONTAINED'}">CONTAINED</option>
                                <option value="RESOLVED" th:selected="${incident.status.name() == 'RESOLVED'}">RESOLVED</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                        </form>
                    </div>
                </div>

                <hr>

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="p-3 bg-light rounded-3 text-center">
                            <span class="text-muted small">Disaster Type</span>
                            <h6 class="fw-bold mb-0 mt-1" th:text="${incident.incidentType.label}">FLOOD</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 bg-light rounded-3 text-center">
                            <span class="text-muted small">Impact Radius</span>
                            <h6 class="fw-bold mb-0 mt-1"><span th:text="${incident.radiusKm}">10</span> km</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 bg-light rounded-3 text-center">
                            <span class="text-muted small">Affected People</span>
                            <h6 class="fw-bold mb-0 mt-1" th:text="${incident.affectedPeopleEstimate}">0</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 bg-light rounded-3 text-center">
                            <span class="text-muted small">Casualties Reported</span>
                            <h6 class="fw-bold mb-0 mt-1 text-danger" th:text="${incident.casualtiesReported}">0</h6>
                        </div>
                    </div>
                </div>

                <h5 class="fw-bold mb-2">Ground Situation Report</h5>
                <p class="text-secondary" th:text="${incident.description}">Situation details...</p>

                <div class="d-flex gap-2 mt-4">
                    <a th:href="@{/requests/create(incidentId=${incident.id})}" class="btn btn-danger">
                        <i class="bi bi-plus-circle me-1"></i> Request Aid for This Incident
                    </a>
                    <a th:href="@{/tracking/map}" class="btn btn-outline-dark">
                        <i class="bi bi-map me-1"></i> View on GIS Map
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
